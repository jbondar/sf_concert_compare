# Mount SF Concert Compare at https://example.com/sfconcert
#
# Drop this inside the existing <VirtualHost *:443> for the site, or Include it
# from there. Requires: proxy, proxy_http, headers.
#
#   a2enmod proxy proxy_http headers   # Debian/Ubuntu
#   apachectl -M | grep -E 'proxy_http|headers'   # anything else
#
# The app itself runs on 127.0.0.1:8000 and is never exposed directly.

# The trailing slash matters. Without this, /sfconcert (no slash) resolves its
# relative URLs against / and the page loads with no CSS.
RedirectMatch 301 "^/sfconcert$" "/sfconcert/"

<Location "/sfconcert/">
    # Note the trailing slash on the target: it strips the /sfconcert/ prefix
    # so the app sees /, /api/scan, /static/app.js as normal. BASE_PATH tells
    # the app to add the prefix back on the URLs it hands the browser.
    #
    # flushpackets=on is what makes Server-Sent Events work -- without it
    # mod_proxy buffers the scan-progress stream and the UI sits silent until
    # the whole scan finishes.
    ProxyPass        "http://127.0.0.1:8000/" flushpackets=on
    ProxyPassReverse "http://127.0.0.1:8000/"

    # Compression would buffer the SSE stream too.
    SetEnv no-gzip 1
    SetEnv dont-vary 1

    # Tell the app it is behind TLS so it does not build http:// redirects.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/sfconcert"
</Location>

# A full library scan with playlists can run for several minutes, and the SSE
# connection stays open the whole time. The default 60s would cut it off.
ProxyTimeout 600

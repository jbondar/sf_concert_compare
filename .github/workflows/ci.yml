name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # The suite parses saved fixtures, so it never touches the network.
        run: pytest -q
      - name: Check the app imports
        run: python -c "from app.main import app; print('ok')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sf-concert-compare .
      - name: Boot it and hit the health check
        run: |
          docker run -d --name sfcc -p 8000:8000 sf-concert-compare
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "never became healthy"; docker logs sfcc; exit 1

services:
  web:
    build: .
    image: sf-concert-compare
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides the .env value so the redirect matches the mapped port.
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8000/callback}
    restart: unless-stopped
